<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Creations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f4f3ef; --fg: #121212; --muted: #7a7872; --line: #d9d7d0; --card: #e9e7e1;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg: #0e0e0f; --fg: #ecebe6; --muted: #7d7c78; --line: #26262a; --card: #18181b; }
    }
    :root[data-theme="dark"] { --bg: #0e0e0f; --fg: #ecebe6; --muted: #7d7c78; --line: #26262a; --card: #18181b; }

    * { box-sizing: border-box; margin: 0; }
    body { background: var(--bg); color: var(--fg); font: 400 15px/1.5 "Inter Tight", system-ui, sans-serif; }
    .wrap { max-width: 1280px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 48px); }

    header { padding: clamp(48px, 10vw, 120px) 0 clamp(32px, 6vw, 64px); border-bottom: 1px solid var(--line); }
    h1 { font-weight: 700; font-size: clamp(48px, 11vw, 152px); line-height: .88; letter-spacing: -.045em; }
    .meta { display: flex; justify-content: space-between; gap: 16px; margin-top: 24px; font: 500 12px/1.4 "JetBrains Mono", monospace; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); gap: clamp(16px, 2.5vw, 32px); padding: clamp(32px, 5vw, 64px) 0; }
    .card { display: block; color: inherit; text-decoration: none; }
    .card .media { aspect-ratio: 4 / 3; overflow: hidden; background: var(--card); position: relative; }
    .card img { display: block; }
    .card .ph { display: grid; }
    .card img, .card .ph { width: 100%; height: 100%; object-fit: cover; transition: transform .6s cubic-bezier(.2,.7,.2,1); }
    .card:hover img { transform: scale(1.04); }
    .card .media::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: var(--accent); transform: scaleX(0); transform-origin: left; transition: transform .4s ease; }
    .card:hover .media::after { transform: scaleX(1); }
    .card .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-top: 14px; }
    .card h2 { font-size: 22px; font-weight: 500; letter-spacing: -.02em; }
    .card .n, .card p { font: 400 12px/1.4 "JetBrains Mono", monospace; color: var(--muted); }
    .card p { margin-top: 4px; }
    .badge { position: absolute; top: 12px; left: 12px; z-index: 1; font: 500 10px "JetBrains Mono", monospace; letter-spacing: .12em; text-transform: uppercase; padding: 4px 8px; background: var(--bg); color: var(--fg); border: 1px solid var(--line); }
    .badge::before { content: ""; display: inline-block; width: 6px; height: 6px; margin-right: 6px; vertical-align: 1px; background: var(--accent); }
    .card--planned .media { background: var(--card); }
    .card--more { border: 1px dashed var(--line); display: grid; place-items: center; min-height: 200px; color: var(--muted); font: 400 13px "JetBrains Mono", monospace; text-transform: uppercase; letter-spacing: .1em; }

    .ph { display: grid; place-items: center; background: repeating-linear-gradient(135deg, transparent 0 14px, var(--line) 14px 15px); }
    .ph span { font: 500 11px "JetBrains Mono", monospace; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; background: var(--card); padding: 4px 8px; }

    footer { border-top: 1px solid var(--line); padding: 24px 0 40px; font: 400 12px "JetBrains Mono", monospace; color: var(--muted); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Creations</h1>
      <div class="meta"><span>Prints · Models · Builds</span><span id="count"></span></div>
    </header>
    <main class="grid" id="grid"></main>
    <footer>Click a project to open its gallery.</footer>
  </div>

  <script src="projects.js"></script>
  <script src="common.js"></script>
  <script>
    const accents = { marathon: "#c6ff1a", expanse: "#ff8a2a", field: "#ff5a1f", plain: "currentColor" };
    const statusLabel = { planned: "Planned", wip: "In progress" };
    const grid = document.getElementById("grid");
    document.getElementById("count").textContent = `${pad(PROJECTS.length)} project${PROJECTS.length === 1 ? "" : "s"}`;
    grid.innerHTML = PROJECTS.map((p, i) => `
      <a class="card${p.status ? " card--" + esc(p.status) : ""}" href="project.html?p=${encodeURIComponent(p.slug)}" style="--accent:${accents[p.theme] || "currentColor"}">
        <div class="media">${p.status ? `<span class="badge">${statusLabel[p.status] || esc(p.status)}</span>` : ""}${p.cover
          ? `<img src="${esc(p.cover)}" alt="${esc(p.title)}" loading="lazy" data-fallback="${esc(p.title)}">`
          : `<div class="ph"><span>${esc(p.code || p.title)}</span></div>`}</div>
        <div class="row"><h2>${esc(p.title)}</h2><span class="n">${pad(i + 1)} · ${esc(p.year || "")}</span></div>
        <p>${esc(p.subtitle || "")}</p>
      </a>`).join("") + `<div class="card--more">+ More to come</div>`;
    wireFallbacks(grid);
  </script>
</body>
</html>
